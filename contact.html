<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popeyes - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html" style="color: #ff6600;">Popeyes</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5" style="max-width: 600px;">
        <h1 class="text-warning fw-bold mb-3">Contact Us</h1>
        <p class="text-secondary mb-4">If you have any questions or feedback, please fill out the form below.</p>

        <form id="contact-form" class="p-4 border rounded shadow-sm bg-white">
            <div class="mb-3">
                <label for="name" class="form-label fw-bold">Full Name:</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email Address:</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="fav-color" class="form-label fw-bold">Choose your favorite color:</label>
                <input type="color" id="fav-color" name="fav-color" class="form-control form-control-color w-100" value="#ff6600">
            </div>

            <div class="mb-3">
                <label for="message" class="form-label fw-bold">Message:</label>
                <textarea id="message" name="message" class="form-control" rows="4"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Submit</button>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Popeyes Project. Team Members: Tumenbay Aidana and Mussabekuly Kuanysh</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
